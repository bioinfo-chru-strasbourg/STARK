<!DOCTYPE html>
<html>
<head>
    <title>STARK API</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body>
    <div id="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="login-error" class="error"></p>
    </div>

    <div id="dashboard-container" style="display: none;">
        <div class="header">
            <h1>STARK API</h1>
            <div class="header-user">
                <span id="current-user"></span>
                <button id="logout-btn">Logout</button>
            </div>
        </div>

        <div class="view-tabs">
            <button class="tab-btn active" id="tab-tasks">Analyses</button>
            <button class="tab-btn" id="tab-launch" style="display:none">Launch</button>
            <button class="tab-btn" id="tab-cluster">Cluster</button>
            <button class="tab-btn" id="tab-archives">Archives</button>
        </div>

        <!-- ── Tasks view ──────────────────────────────────────────── -->
        <div id="view-tasks">
            <div id="analyses-header-row">
                <h2>Analyses</h2>
            </div>
            <div id="tasks-filters">
                <div class="filter-group" id="tasks-filter-nodes-group" style="display:none">
                    <span class="filter-label">Node</span>
                    <span id="tasks-filter-nodes-container"></span>
                </div>
                <div class="filter-group" id="tasks-filter-queues-group" style="display:none">
                    <span class="filter-label">Queue</span>
                    <span id="tasks-filter-queues-container"></span>
                </div>
                <div class="filter-group" id="tasks-filter-states-group">
                    <span class="filter-label">State</span>
                    <span id="tasks-filter-states-container"></span>
                </div>
                <div class="filter-group">
                    <input type="text" id="tasks-search" placeholder="Search analysis name…" class="tasks-search-input">
                </div>
                <div class="filter-group">
                    <button id="tasks-filter-reset" title="Reset all filters">Reset</button>
                </div>
                <div class="filter-group">
                    <button id="tasks-refresh-btn" title="Refresh tasks">Refresh</button>
                </div>
            </div>
            <div id="tasks-table-container">
                <table id="tasks-table" class="cluster-tasks-table">
                    <thead>
                        <tr>
                            <th data-col="node">Node <span class="sort-icon"></span></th>
                            <th data-col="id">ID <span class="sort-icon"></span></th>
                            <th data-col="queue">Queue <span class="sort-icon"></span></th>
                            <th data-col="task_slots">Slots <span class="sort-icon"></span></th>
                            <th data-col="state">State <span class="sort-icon"></span></th>
                            <th data-col="times">Time <span class="sort-icon"></span></th>
                            <th data-col="run_name">Analysis Name <span class="sort-icon"></span></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-body"></tbody>
                </table>
            </div>
        </div><!-- /view-tasks -->

        <!-- ── Cluster view ────────────────────────────────────────── -->
        <div id="view-cluster" style="display:none">
            <div id="cluster-summary-container">
                <h2>Cluster Resources</h2>
                <div class="filter-group">
                    <button id="cluster-refresh-btn" title="Refresh cluster">Refresh</button>
                </div>
                <div id="cluster-summary-content">
                    <p class="cluster-loading">Loading…</p>
                </div>
            </div>
        </div><!-- /view-cluster -->

        <!-- ── Launch Analysis view ────────────────────────────────── -->
        <div id="view-launch" style="display:none">
            <h2>Launch Analysis</h2>
            <div class="launch-sub-tabs">
                <button class="launch-sub-tab-btn active" id="launch-tab-run">Run</button>
                <button class="launch-sub-tab-btn" id="launch-tab-advanced">Advanced (JSON)</button>
            </div>

            <div id="launch-view-run">
                <form id="analysis-form-run">
                    <div class="form-row">
                        <label for="run-name-input">STARK Run name</label>
                        <input type="text" id="run-name-input" placeholder="MY_RUN">
                    </div>
                    <div class="launch-row">
                        <button type="submit">Launch</button>
                    </div>
                </form>
            </div>

            <div id="launch-view-advanced" style="display:none">
                <form id="analysis-form-advanced">
                    <textarea id="json-input" placeholder='{"run":"MY_RUN", "queue":"light", "threads":2}'></textarea>
                    <div class="launch-row">
                        <button type="submit">Launch</button>
                    </div>
                </form>
            </div>

            <div id="launch-result" style="display:none">
                <div id="launch-result-content"></div>
            </div>
        </div><!-- /view-launch -->

        <!-- ── Archives view ───────────────────────────────────────── -->
        <div id="view-archives" style="display:none">
            <div id="archives-header-row">
                <h2>Archived Analyses</h2>
            </div>
            <div id="archives-filters">
                <div class="filter-group" id="archives-filter-nodes-group" style="display:none">
                    <span class="filter-label">Node</span>
                    <span id="archives-filter-nodes-container"></span>
                </div>
                <div class="filter-group" id="archives-filter-queues-group" style="display:none">
                    <span class="filter-label">Queue</span>
                    <span id="archives-filter-queues-container"></span>
                </div>
                <div class="filter-group" id="archives-filter-status-group">
                    <span class="filter-label">Status</span>
                    <span id="archives-filter-status-container"></span>
                </div>
                <div class="filter-group">
                    <input type="text" id="archives-search" placeholder="Search analysis name…" class="tasks-search-input">
                </div>
                <div class="filter-group">
                    <button id="archives-filter-reset" title="Reset all filters">Reset</button>
                </div>
                <div class="filter-group">
                    <button id="archives-refresh-btn" title="Refresh archives">Refresh</button>
                </div>
            </div>
            <div id="archives-content">
                <p class="cluster-loading">Loading…</p>
            </div>
        </div><!-- /view-archives -->

    </div>

    <div id="detailModal" style="display:none;">
    <div class="modal-content">
        <span id="detailClose" class="close">X</span>
        <div id="detailBody"></div>
    </div>
    </div>

    <script src="/static/script.js?v={{ version }}"></script>
    <script>const REFRESH_INTERVAL_MS = {{ refresh_interval_ms }};</script>
</body>
</html>
